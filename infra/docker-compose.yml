version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gymos_postgres
    restart: always
    environment:
      POSTGRES_USER: gymos_admin
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: gymos_db
    ports:
      - "5432:5432"
    volumes:
      - gymos_pgdata:/var/lib/postgresql/data

volumes:
  gymos_pgdata:
