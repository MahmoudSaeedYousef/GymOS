jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519_gymos
          chmod 600 ~/.ssh/id_ed25519_gymos
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519_gymos ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /opt/gymos

            git fetch origin main
            git reset --hard origin/main

            cd /opt/gymos/infra
            docker compose up -d --build
            docker compose ps

            echo "Waiting for GymOS API on port 5050..."
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:5050/swagger/index.html > /dev/null 2>&1 || curl -fsS http://127.0.0.1:5050/health > /dev/null 2>&1; then
                echo "GymOS API is up and responding!"
                exit 0
              fi
              sleep 3
            done

            echo "API did not respond in time. Recent logs:"
            docker compose logs --tail=50 api
            exit 1
          EOF
